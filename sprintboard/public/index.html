<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprintboard</title>
<link rel="stylesheet" href="/style.css">
<header>
  <h1>sprintboard</h1>
  <span id="fetched-at"></span>
  <button id="refresh">refresh</button>
</header>
<div id="errors"></div>
<main id="board"></main>
<aside id="sessions">
  <h2>sessions</h2>
  <div id="session-list"></div>
  <pre id="session-tail"></pre>
</aside>
<dialog id="hide-confirm">
  <p>Hide <strong id="hide-confirm-title"></strong>?</p>
  <div class="actions">
    <button id="hide-confirm-yes">hide</button>
    <button id="hide-confirm-no">cancel</button>
  </div>
</dialog>
<dialog id="note-edit">
  <h3 id="note-edit-heading"></h3>
  <input id="note-title" placeholder="title">
  <textarea id="note-details" rows="4" placeholder="details (optional)"></textarea>
  <div class="actions">
    <button id="note-save">save</button>
    <button id="note-cancel">cancel</button>
  </div>
</dialog>
<dialog id="note-delete-confirm">
  <p>Delete note <strong id="note-delete-title"></strong>?</p>
  <div class="actions">
    <button id="note-delete-yes">delete</button>
    <button id="note-delete-no">cancel</button>
  </div>
</dialog>
<script src="/hidden.js"></script>
<script src="/order.js"></script>
<script src="/app.js"></script>
