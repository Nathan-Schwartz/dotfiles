<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprintboard</title>
<link rel="stylesheet" href="/style.css">
<header>
  <h1>sprintboard</h1>
  <span id="fetched-at"></span>
  <button id="refresh">refresh</button>
</header>
<div id="errors"></div>
<main id="board"></main>
<aside id="sessions">
  <h2>sessions</h2>
  <div id="session-list"></div>
  <pre id="session-tail"></pre>
</aside>
<dialog id="hide-confirm">
  <p>Hide <strong id="hide-confirm-title"></strong>?</p>
  <div class="actions">
    <button id="hide-confirm-yes">hide</button>
    <button id="hide-confirm-no">cancel</button>
  </div>
</dialog>
<script src="/hidden.js"></script>
<script src="/app.js"></script>
